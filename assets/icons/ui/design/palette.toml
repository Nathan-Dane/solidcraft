# Icon colour roles. Artwork in svg/ uses the light hex values below (or `currentColor` for the
# `line` role); the generator maps each hex to its role and the app resolves the role to the
# value for the active theme. Every role has a light and a dark hex.
# Dark theme: outlines become light, faces darken (lightest face stays lightest), blues invert in
# lightness so the active ramp keeps its order against the dark background.

[roles.ink]        # outlines and details drawn over a face
light = "#34465b"
dark  = "#dbe4ee"
[roles.line]       # line art that sits directly on the UI background (SVG: currentColor)
light = "#34465b"
dark  = "#dbe4ee"
[roles.passive-1]  # passive geometry, lightest face
light = "#e2e8ef"
dark  = "#566377"
[roles.passive-2]
light = "#b8c3cf"
dark  = "#455266"
[roles.passive-3]  # darkest passive face
light = "#8e9faf"
dark  = "#354152"
[roles.gap]        # knock-out gaps that separate overlapping parts: the surface behind the icon
light = "#ffffff"
dark  = "#1e2530"
[roles.guide]      # construction and guide dots
light = "#6f879c"
dark  = "#8a9db0"
[roles.active-1]   # changed or result geometry, palest face
light = "#b9ddf8"
dark  = "#244a70"
[roles.active-2]
light = "#328bd3"
dark  = "#3f93de"
[roles.active-3]   # strongest blue: strokes and accents
light = "#236ead"
dark  = "#86c8f8"

[strokes]          # on the 64 grid
geometry = 2.55
action = 4.25
navigation = 5.6
parameters = 4.2

# Accent colours. An accent replaces the roles it lists (normally the three `active-*` blues), so
# an icon keeps its drawing and only changes colour: "extrude" in the Solid accent and
# "surface_extrude" (see aliases.toml) are the same artwork in orange. Roles an accent does not
# list keep their base value. Edit hex values here; nothing else needs to change.
# Shared accent definitions: Solid uses the base palette; Surface uses orange,
# Form purple, Mesh yellow, Sketch amber. Apply them through semantic aliases.

[accents.surface.active-1]
light = "#fbdcb9"
dark  = "#5a3510"
[accents.surface.active-2]
light = "#e08a2c"
dark  = "#e69a45"
[accents.surface.active-3]
light = "#b45a0a"
dark  = "#f7c58a"

[accents.form.active-1]
light = "#dccdf6"
dark  = "#3b2a66"
[accents.form.active-2]
light = "#8a5cd6"
dark  = "#9b72e8"
[accents.form.active-3]
light = "#6a3fc2"
dark  = "#c6aef7"

[accents.mesh.active-1]
light = "#fbefb0"
dark  = "#5a4a0c"
[accents.mesh.active-2]
light = "#e0b400"
dark  = "#e8c52a"
[accents.mesh.active-3]
light = "#a07f00"
dark  = "#f6e07a"

[accents.sketch.active-1]
light = "#f6e0cf"
dark  = "#5a3a1e"
[accents.sketch.active-2]
light = "#d9731a"
dark  = "#e8913d"
[accents.sketch.active-3]
light = "#b4530a"
dark  = "#f0b57c"
