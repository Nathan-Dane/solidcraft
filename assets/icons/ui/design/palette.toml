# Icon colour roles. Artwork in svg/ uses the stable source hex values below (or `currentColor`
# for the `line` role); the generator maps each identifier to its role and the app resolves the role to the
# value for the active theme. `source` is the stable SVG identifier; edit only light/dark
# display values or accent ramps to recolour finished artwork without modifying SVGs.
# Dark theme: outlines become light, faces darken (lightest face stays lightest), blues invert in
# lightness so the active ramp keeps its order against the dark background.

[roles.ink]        # outlines and details drawn over a face
source = "#34465b"
light = "#34465b"
dark  = "#dbe4ee"
[roles.line]       # line art that sits directly on the UI background (SVG: currentColor)
source = "#34465b"
light = "#34465b"
dark  = "#dbe4ee"
[roles.passive-1]  # passive geometry, lightest face
source = "#e2e8ef"
light = "#e2e8ef"
dark  = "#566377"
[roles.passive-2]
source = "#b8c3cf"
light = "#b8c3cf"
dark  = "#455266"
[roles.passive-3]  # darkest passive face
source = "#8e9faf"
light = "#8e9faf"
dark  = "#354152"
[roles.gap]        # knock-out gaps that separate overlapping parts: the surface behind the icon
source = "#ffffff"
light = "#ffffff"
dark  = "#1e2530"
[roles.guide]      # construction and guide dots
source = "#6f879c"
light = "#6f879c"
dark  = "#8a9db0"
[roles.active-1]   # changed or result geometry, palest face
source = "#b9ddf8"
light = "#b9ddf8"
dark  = "#244a70"
[roles.active-2]
source = "#328bd3"
light = "#328bd3"
dark  = "#3f93de"
[roles.active-3]   # strongest blue: strokes and accents
source = "#236ead"
light = "#236ead"
dark  = "#86c8f8"

[strokes]          # on the 64 grid
geometry = 2.55
action = 4.25
navigation = 5.6
parameters = 4.2

# Accent colours. An accent replaces the roles it lists (normally the three `active-*` blues), so
# an icon keeps its drawing and only changes colour: "extrude" in the Solid accent and
# "surface_extrude" (see aliases.toml) are the same artwork in orange. Roles an accent does not
# list keep their base value. Edit hex values here; nothing else needs to change.
# Shared accent definitions: Solid uses the base palette; Surface uses orange,
# Form purple, Mesh yellow, Sketch green, constraints red and Sketch construction orange.
# This is the single colour authority for SVGs, semantic UI tokens and the review page.
# Active-3 is the primary stroke; active-1/2 preserve face shading. SVG source hexes
# above are stable role identifiers: change these accent ramps, not accepted artwork.

[accents.surface.active-1]
light = "#fbdcb9"
dark  = "#5a3510"
[accents.surface.active-2]
light = "#e08a2c"
dark  = "#e69a45"
[accents.surface.active-3]
light = "#b45a0a"
dark  = "#f7c58a"

[accents.form.active-1]
light = "#dccdf6"
dark  = "#3b2a66"
[accents.form.active-2]
light = "#8a5cd6"
dark  = "#9b72e8"
[accents.form.active-3]
light = "#6a3fc2"
dark  = "#c6aef7"

[accents.mesh.active-1]
light = "#fbefb0"
dark  = "#5a4a0c"
[accents.mesh.active-2]
light = "#e0b400"
dark  = "#e8c52a"
[accents.mesh.active-3]
light = "#a07f00"
dark  = "#f6e07a"

[accents.sketch.active-1]
light = "#c7ead4"
dark  = "#203e2d"
[accents.sketch.active-2]
light = "#55ab75"
dark  = "#489968"
[accents.sketch.active-3]
light = "#2e965a"
dark  = "#6ec88c"

[accents.constraint.active-1]
light = "#f1d0cb"
dark  = "#522d2a"
[accents.constraint.active-2]
light = "#c26960"
dark  = "#c97c72"
[accents.constraint.active-3]
light = "#962823"
dark  = "#f0a59b"

[accents.construction.active-1]
light = "#fae1c4"
dark  = "#513719"
[accents.construction.active-2]
light = "#d18b3c"
dark  = "#cc8839"
[accents.construction.active-3]
light = "#e88c30"
dark  = "#e88c30"
# Only this semantic icon uses guide paint for its actual line. Other guides stay grey.
[accents.construction.guide]
use = "active-3"

# Same accessibility adjustments as the application's semantic UI tokens.
# Protan/Deutan share red-green; Tritan uses blue-yellow. Unlisted roles keep their ramp.
[variants.red-green.sketch.active-3]
light = "#3c9669"
dark  = "#96e1c3"
[variants.blue-yellow.constraint.active-3]
light = "#962823"
dark  = "#f0b4a5"

# Default accent by requested icon id. Explicit alias accents in aliases.toml win.
# Deliberately not inherited from a master: ground reuses c_fix but is not a constraint.
# Construct/Inspect and shared file/edit utilities retain the base blue in every workspace.
[icon-accents]
surface = [
  "boundary", "blend_surface", "offset_surface", "patch", "reverse_normal",
  "ruled", "stitch", "thicken", "unstitch", "untrim",
]
sketch = [
  "arc3", "arc_center", "arc_slot", "arc_slot_center", "arc_tangent",
  "blend", "circle", "circle2", "circle3", "circle_tt",
  "circle_ttt", "conic", "constrainer", "dimension", "ellipse",
  "extend", "finish", "fit_section", "include", "infinite",
  "intersect", "intersection_curve", "iso_curve", "line", "line_mid",
  "offset", "point", "polygon", "polygon_circumscribed", "polygon_edge",
  "project", "project_surface", "rect", "rect3", "rect_center",
  "rect_rounded", "sketch", "sketch_chamfer", "sketch_chamfer_angle", "sketch_chamfer_two_distances",
  "sketch_fillet", "sketch_mirror", "slot", "slot_center", "slot_overall",
  "snap", "spline", "spline_cv", "spun", "svg",
  "trim",
]
constraint = [
  "auto_constrain", "c_coincident", "c_collinear", "c_concentric", "c_equal",
  "c_fix", "c_hv", "c_midpoint", "c_parallel", "c_perpendicular",
  "c_polygon", "c_smooth", "c_symmetry", "c_tangent",
]
construction = [
  "centerline", "construction",
]
