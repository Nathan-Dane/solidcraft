# App icon ids that reuse another master instead of carrying a copy.
# `alias-id = "master-id"`; masters are svg/*/<id>.svg (the model/flat/workspace family wins over small/).
[alias]
circle2 = "circle"
circle3 = "circle"
circle_tt = "circle"
circle_ttt = "circle"
rect3 = "rect"
rect_center = "rect"
rect_rounded = "rect"
arc_center = "arc3"
arc_tangent = "arc3"
spline_cv = "spline"
sketch_rect_pattern = "pattern_rect"
sketch_circ_pattern = "pattern_circ"
plastic_rule = "plastic_assign"
