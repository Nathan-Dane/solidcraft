[package]
name = "solidcraft-theme-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
solidcraft-ui-egui = { workspace = true, features = ["theme-studio"] }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "DomRect", "Element", "HtmlCanvasElement"] }
